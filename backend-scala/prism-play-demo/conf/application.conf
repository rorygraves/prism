# Prism Play Framework Demo Configuration

# Application secret (override in production)
# Must be at least 256 bits (32 characters) for HS256
play.http.secret.key = "changeme_dev_secret_at_least_32_chars_hs256_algorithm_required_for_jwt"
play.http.secret.key = ${?APPLICATION_SECRET}

# HTTP server configuration
play.server.http.port = 8000
play.server.http.port = ${?PORT}

# WebSocket configuration
play.server.websocket.frame.maxLength = 64k

# Allowed hosts
play.filters.hosts {
  allowed = ["."]
}

# CORS filter
play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = null
}

# Disable CSRF for WebSocket
play.filters.csrf.header.bypassHeaders {
  X-Requested-With = "*"
  Csrf-Token = "nocheck"
}

# Enable all filters
play.filters.enabled += "play.filters.cors.CORSFilter"

# Akka configuration
akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  actor {
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 3.0
        parallelism-max = 64
      }
    }
  }
}

# Logging
play.logger.root = INFO
play.logger.play = INFO
play.logger.application = DEBUG
