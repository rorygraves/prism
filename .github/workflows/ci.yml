name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      working-directory: backend
      run: poetry install --no-interaction

    - name: Run backend tests
      working-directory: backend
      run: poetry run pytest -v --cov=prism --cov=chat_demo --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: latest

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          frontend/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install backend dependencies
      working-directory: backend
      run: poetry install --no-interaction

    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Build frontend packages
      working-directory: frontend
      run: |
        cd packages/prism-client && pnpm run build
        cd ../prism-vue && pnpm run build

    - name: Install Playwright browsers
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run E2E tests (Chromium only)
      working-directory: e2e
      run: npx playwright test --project=chromium
      env:
        CI: true

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: e2e/test-results/
        retention-days: 30

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: latest

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}

    - name: Install backend dependencies
      working-directory: backend
      run: poetry install --no-interaction

    - name: Python type checking (mypy)
      working-directory: backend
      run: poetry run mypy prism chat_demo || true
      continue-on-error: true

    - name: Python linting (ruff)
      working-directory: backend
      run: poetry run ruff check prism chat_demo || true
      continue-on-error: true

    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Frontend type checking
      working-directory: frontend
      run: |
        cd packages/prism-client && pnpm run build
        cd ../prism-vue && pnpm run build
      continue-on-error: true
