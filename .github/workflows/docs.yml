name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java (for Scala)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        working-directory: implementations/python
        run: |
          poetry install --with docs

      - name: Build Python API docs with Sphinx
        working-directory: implementations/python
        run: |
          poetry run sphinx-build -b html docs ../../docs/api/python

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install TypeScript dependencies
        working-directory: implementations/typescript
        run: pnpm install

      - name: Build TypeScript packages
        working-directory: implementations/typescript
        run: pnpm run build

      - name: Build TypeScript API docs with TypeDoc
        working-directory: implementations/typescript
        run: pnpm run docs

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build Scala API docs with ScalaDoc
        working-directory: implementations/scala
        run: |
          sbt core/doc
          mkdir -p ../../docs/api/scala
          cp -r core/target/scala-3.3.1/api/* ../../docs/api/scala/

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs-material
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-minify-plugin

      - name: Build MkDocs site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
